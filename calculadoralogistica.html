<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardNet - Calculadora de Logística</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo">
        <!-- Coloque aqui sua logo -->
        <img src="logo.png" alt="CardNet" id="logo">
        <h1>CARDNET</h1>
        <p>Calculadora de Logística</p>
    </div>

    <div class="card">

        <label>Quantidade de Cartões</label>

        <input
            type="number"
            id="quantidade"
            placeholder="Digite a quantidade">

        <div class="botoes">
            <button class="calcular" onclick="calcular()">
                CALCULAR
            </button>

            <button class="limpar" onclick="limpar()">
                LIMPAR
            </button>
        </div>

        <div class="resultado">

            <div class="item">
                <span>Peso</span>
                <strong id="peso">0,00 kg</strong>
            </div>

            <div class="item">
                <span>Volumes</span>
                <strong id="volumes">0</strong>
            </div>

        </div>

        <div class="regras">
            <p>500 cartões = 3 kg</p>
            <p>5.000 cartões = 1 volume</p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
